[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-palette-studio"
version = "0.1.0"
description = "A reusable scientific palette library and chart preview studio."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
palette-studio = "scientific_palette_studio.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
