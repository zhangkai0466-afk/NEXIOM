[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexiom-visualization"
version = "1.7.1"
description = "NEXIOM native evidence-bound scientific visualization engine."
readme = "UPSTREAM_README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22.0,<5.0",
    "json-repair>=0.30.0,<1.0",
    "matplotlib>=3.8.0,<4.0",
    "seaborn>=0.13.2,<0.14",
    "scipy>=1.11,<2.0",
    "numpy>=1.26.0,<3.0",
    "jinja2>=3.1.0,<4.0",
    "pandas>=2.1.0,<4.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
