<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317674f'/%3E%3Ctext x='8' y='24' font-size='23' font-family='sans-serif' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  <title>NEXIOM · 赛题项目导航草案</title>
  <style>
    :root{color-scheme:light;--bg:#f7f9f8;--paper:#fcfdfc;--ink:#263b32;--muted:#819087;--line:#e4ebe6;--green:#17674f;--selected:#eaf3ed;--sidebar:248px;--duration:240ms}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #72ad94;outline-offset:3px}button:disabled{cursor:wait;opacity:.6}.icon{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100dvh}.sidebar{height:100dvh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--paper);border-right:1px solid var(--line);min-height:0;overflow:hidden}.brand{display:flex;align-items:center;gap:10px;padding:29px 27px 25px;font-size:19px;font-weight:700;letter-spacing:2px;flex-shrink:0}.brand-mark{width:31px;height:33px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;letter-spacing:0;font-size:19px}
    .sidebar-body{position:relative;flex:1;overflow:hidden;min-height:0}.layer{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 15px 18px;transition:transform var(--duration) cubic-bezier(.22,.68,0,1),opacity var(--duration) ease;min-height:0;will-change:transform,opacity}.library-layer{transform:translateX(0);opacity:1}.workspace-layer{transform:translateX(100%);opacity:0}.sidebar.in-project .library-layer{transform:translateX(-100%);opacity:0}.sidebar.in-project .workspace-layer{transform:translateX(0);opacity:1}
    .add-project{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #dbe5de;background:#fff;border-radius:9px;padding:11px 10px;width:100%;font-size:13px}.add-project:hover{background:var(--selected);border-color:#c7dace}.section-label{display:flex;align-items:center;justify-content:space-between;padding:25px 12px 12px;font-size:11px;color:var(--muted)}.project-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;flex:1;padding:2px 0}.project-item{display:flex;gap:11px;align-items:flex-start;width:100%;border:1px solid transparent;border-radius:9px;padding:13px 11px;background:transparent;text-align:left}.project-item:hover{background:#f0f5f1}.project-item:focus-visible{outline-offset:-2px}.project-item .icon{margin-top:2px;color:#718e7c}.project-copy{min-width:0;flex:1}.project-name{display:block;font-size:13px;line-height:1.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-folder{display:block;font-size:10px;color:#92a096;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sample-label{font-size:9px;color:#8a9c8f;margin-top:6px}.chevron{color:#91a397;font-size:16px;align-self:center}.new-project{animation:highlight 1100ms ease-out}@keyframes highlight{from{background:#dceee2}to{background:transparent}}
    .back-button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;color:#798b7e;font-size:12px;border-radius:7px;align-self:flex-start;margin-bottom:18px}.back-button:hover{background:#eff4f0}.workspace-label{padding:0 12px 21px;flex-shrink:0}.workspace-label small{font-size:10px;color:#93a298;display:block;margin-bottom:7px}.workspace-label h1{font-size:15px;line-height:1.6;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.workspace-label p{font-size:10px;color:#99a69d;margin:7px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dimension-nav{display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0}.nav-button,.utility-button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;border-radius:9px;padding:11px 12px;font-size:13px;color:#667b6d;flex-shrink:0}.nav-button:hover,.utility-button:hover{background:#f0f4f1}.nav-button.active{background:var(--selected);color:var(--green);font-weight:600}.nav-button.active:after{content:"";width:5px;height:5px;border-radius:50%;margin-left:auto;background:var(--green)}.utilities{margin-top:auto;padding-top:22px;flex-shrink:0}.utility-button{font-size:12px;padding-top:10px;padding-bottom:10px}.utility-button.selected{background:var(--selected);color:var(--green)}.sidebar-foot{border-top:1px solid var(--line);padding:13px 12px 0;margin-top:14px;font-size:10px;color:#9ba89f;line-height:1.8;flex-shrink:0}
    .main{min-width:0;display:flex;flex-direction:column;min-height:100dvh}.main-header{margin:0 34px;height:79px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #eaf0ec;flex-shrink:0}.breadcrumb{display:flex;align-items:center;gap:10px;font-size:12px;color:#7f9085;min-width:0}.crumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.divider{color:#bdc8c0}.prototype-label{font-size:10px;color:#95a39a;white-space:nowrap}.blank-content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 25px 100px}.placeholder{text-align:center;color:#b1bcb5;font-size:12px;line-height:2.1;letter-spacing:.5px}.placeholder p{margin:0}.placeholder small{font-size:10px;color:#bec7c1;letter-spacing:0}.status{position:fixed;bottom:24px;left:calc(var(--sidebar) + (100vw - var(--sidebar))/2);transform:translateX(-50%);background:#244234;color:white;padding:11px 17px;border-radius:9px;font-size:12px;box-shadow:0 6px 24px #14302315;max-width:calc(100vw - var(--sidebar) - 35px);z-index:5}.status[hidden]{display:none}
    dialog{padding:0;border:1px solid var(--line);border-radius:15px;width:460px;max-width:calc(100vw - 36px);box-shadow:0 25px 90px #14352324;color:var(--ink)}dialog::backdrop{background:#16332330;backdrop-filter:blur(3px)}.dialog-content{padding:28px}.dialog-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.dialog-title h2{font-size:19px;margin:0;font-weight:600}.close-button{border:0;background:transparent;border-radius:5px;padding:5px;display:grid;place-items:center;color:#7e8d83}.dialog-description{font-size:12px;color:#819286;line-height:1.9;margin:0 0 23px}.field-label{display:block;font-size:12px;margin-bottom:8px}.name-input{border:1px solid #dce6de;border-radius:8px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);font-size:13px;margin-bottom:22px}.folder-picker{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dce6de;border-radius:8px;padding:11px 12px;width:100%;background:#fff;text-align:left;color:#778b7c;font-size:12px}.folder-picker:hover{background:#f7faf8}.folder-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-help{font-size:10px;color:#9ba99f;line-height:1.8;margin:9px 0}.sample-button{border:0;background:transparent;color:var(--green);padding:3px 0;font-size:11px;text-decoration:underline;text-underline-offset:3px}.form-error{font-size:11px;color:#a3523f;line-height:1.8;margin:12px 0 0}.form-error:empty{display:none}.dialog-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}.secondary-button,.primary-button{border-radius:8px;padding:9px 17px;font-size:12px}.secondary-button{border:1px solid var(--line);background:#fff;color:#7f8f84}.primary-button{border:1px solid var(--green);background:var(--green);color:#fff}
    @media(max-width:800px){:root{--sidebar:225px}.main-header{margin:0 22px;flex-wrap:wrap;align-content:center;gap:6px;height:79px}.breadcrumb{width:100%;font-size:11px}.prototype-label{font-size:9px}.brand{padding-left:24px}.status{font-size:11px}.placeholder{font-size:11px}}
    @media(max-width:500px){:root{--sidebar:212px}.main-header{margin:0 12px;height:79px}.breadcrumb{display:block;line-height:1.8}.crumb{display:block}.divider{display:none}.prototype-label{display:none}.blank-content{padding:20px 9px 75px}.placeholder{font-size:10px;letter-spacing:0}.placeholder small{font-size:9px}.status{left:50%;max-width:calc(100vw - 30px);width:max-content}.dialog-content{padding:23px}.sidebar-foot{font-size:9px}}
    @media(max-height:700px){.brand{padding-top:18px;padding-bottom:18px}.back-button{margin-bottom:9px}.workspace-label{padding-bottom:12px}.utilities{padding-top:10px}.sidebar-foot{margin-top:8px;padding-top:8px}.nav-button{padding-top:9px;padding-bottom:9px}.workspace-label p{margin-top:3px}}
    @media(prefers-reduced-motion:reduce){:root{--duration:0ms}.new-project{animation:none}.layer{will-change:auto}}
    .icon.modeling-icon{fill:currentColor;stroke:none}
    .dialog-title{margin-bottom:25px}#thread-name{margin-bottom:0}.project-item{align-items:center}.project-item .icon{margin-top:0}.project-name{line-height:1.7}.workspace-label{padding-bottom:21px}.utilities{border-top:1px solid var(--line);padding-top:10px;margin-top:auto}.dimension-nav{padding-bottom:18px;flex:1}.project-list{padding-top:3px;padding-bottom:18px}
    .dimension-group{flex-shrink:0}.dimension-heading{display:flex;align-items:center;min-width:0;border-radius:9px}.dimension-heading:hover{background:#f0f4f1}.dimension-heading.selected{background:var(--selected)}.dimension-heading .nav-button{flex:1;min-width:0;padding-right:5px;border-radius:9px 0 0 9px;background:transparent;font-weight:500}.dimension-heading.selected .nav-button{color:var(--green);font-weight:600}.dimension-heading .nav-button:after{display:none}.dimension-heading .nav-button span{white-space:nowrap}
    .group-actions{display:flex;align-items:center;padding-right:5px;gap:1px}.group-action{display:grid;place-items:center;border:0;border-radius:5px;background:transparent;color:#85998b;width:24px;height:28px;padding:0}.group-action:hover{background:#dfece3;color:var(--green)}.group-action .icon{width:14px;height:14px}.disclosure .icon{transition:transform 180ms ease}.disclosure[aria-expanded="true"] .icon{transform:rotate(90deg)}
    .thread-list{display:flex;flex-direction:column;gap:3px;border-left:1px solid #dce6df;margin:3px 11px 8px 21px;padding:2px 0 2px 10px}.thread-list[hidden]{display:none}.thread-button,.empty-add{width:100%;border:0;background:transparent;text-align:left;border-radius:7px;padding:8px 10px;color:#7a8b7f;font-size:12px;line-height:1.6;display:flex;align-items:center;gap:8px;min-width:0}.thread-button:hover,.empty-add:hover{background:#eef4ef}.thread-button.active{background:var(--selected);color:var(--green);font-weight:500}.thread-button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thread-button .icon,.empty-add .icon{width:13px;height:13px;flex-shrink:0}.empty-add{color:#809587}
    @media(prefers-reduced-motion:reduce){.disclosure .icon{transition:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="赛题项目导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><span>NEXIOM</span></div>
    <div class="sidebar-body">
      <section class="layer library-layer" id="library-layer" aria-label="赛题项目列表">
        <button class="add-project" id="add-project"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加赛题项目</button>
        <div class="section-label"><span>赛题项目</span><span id="project-count">1</span></div>
        <nav class="project-list" id="project-list" aria-label="已添加的赛题项目"></nav>
        <div class="utilities">
          <button class="utility-button" data-utility="协作经验"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/></svg>协作经验</button>
          <button class="utility-button" data-utility="设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>设置</button>
        </div>
      </section>
      <section class="layer workspace-layer" id="workspace-layer" aria-label="项目内工作维度" aria-hidden="true" inert>
        <button class="back-button" id="back-projects"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>所有赛题</button>
        <div class="workspace-label"><h1 id="project-name"></h1></div>
        <nav class="dimension-nav" id="dimension-nav" aria-label="数学建模工作维度"></nav>
        <div class="utilities">
          <button class="utility-button" data-utility="协作经验"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/></svg>协作经验</button>
          <button class="utility-button" data-utility="项目文件"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3h8v2"/></svg>项目文件</button>
          <button class="utility-button" data-utility="设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>设置</button>
        </div>
      </section>
    </div>
  </aside>
  <main class="main">
    <header class="main-header"><div class="breadcrumb" id="breadcrumb" aria-live="polite"><span class="crumb">赛题项目</span></div></header>
    <div class="blank-content"></div>
  </main>
</div>
<dialog id="add-dialog" aria-labelledby="add-title">
  <form class="dialog-content" id="add-form">
    <div class="dialog-title"><h2 id="add-title">添加赛题项目</h2><button class="close-button" type="button" id="close-dialog" aria-label="关闭添加窗口"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <label class="field-label" for="name-input">赛题项目名称</label><input class="name-input" id="name-input" maxlength="80" required autocomplete="off">
    <label class="field-label" id="folder-label">工作区文件夹</label><button class="folder-picker" id="pick-folder" type="button" aria-labelledby="folder-label folder-text"><span class="folder-text" id="folder-text">选择文件夹</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3h8v2"/></svg></button>
    <p class="form-error" id="form-error" role="alert"></p>
    <div class="dialog-footer"><button type="button" class="secondary-button" id="cancel-add">取消</button><button type="submit" class="primary-button" id="confirm-add">添加项目</button></div>
  </form>
</dialog>
<dialog id="thread-dialog" aria-labelledby="thread-dialog-title">
  <form class="dialog-content" id="thread-form">
    <div class="dialog-title"><h2 id="thread-dialog-title">新建对话</h2><button class="close-button" type="button" id="close-thread-dialog" aria-label="关闭新建对话窗口"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <label class="field-label" for="question-input">问题</label><input class="name-input" id="question-input" list="question-options" maxlength="60" required autocomplete="off"><datalist id="question-options"></datalist>
    <label class="field-label" for="thread-name">对话名称</label><input class="name-input" id="thread-name" maxlength="80" autocomplete="off">
    <div class="dialog-footer"><button class="secondary-button" id="cancel-thread" type="button">取消</button><button class="primary-button" type="submit">创建对话</button></div>
  </form>
</dialog>
<script>
  const paths={overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',reading:'M4 4h7a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM14 7a3 3 0 0 1 3-3h4v15h-4a3 3 0 0 0-3 2',attachments:'M8 12v5a4 4 0 0 0 8 0V6a3 3 0 0 0-6 0v10a1 1 0 0 0 2 0V7',validation:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6',chart:'M4 3v17h17M8 16v-5M13 16V7M18 16v-9',paper:'M5 3h10l4 4v14H5zM14 3v5h5M9 12h6M9 16h6',delivery:'M5 4h14v16H5zM8 8h8M8 12h5m-2 4 2 2 4-4',folder:'M3 7h7l2 2h9v11H3zM3 7V4h7l2 3h8v2',chevron:'m9 5 7 7-7 7',plus:'M12 5v14M5 12h14',chat:'M4 4h16v13H9l-5 4z'};
  const dimensions=[['overview','项目总览'],['reading','赛题研读'],['attachments','附件分析'],['model','开始建模'],['validation','模型检验'],['chart','图表设计'],['paper','论文写作'],['delivery','检查交付']];
  const threadStages=new Set(['model','validation','chart','paper']);
  const projects=[{id:'sample',name:'示例赛题',folder:'示例工作区',lastDimension:'overview',activeThread:null,questions:[],threads:[],expanded:{},handle:null}];
  const state={currentProject:null,pendingFolder:null,sequence:0,threadSequence:0,questionSequence:0,picking:false,transition:0,newThreadStage:null};
  const $=id=>document.getElementById(id);
  const modelingPath='M896 682.666667V469.333333h-341.333333V341.333333H768V0H256v341.333333h213.333333v128h-341.333333V682.666667H0v341.333333h341.333333V682.666667H213.333333V554.666667h597.333334V682.666667H682.666667v341.333333h341.333333V682.666667h-128zM256 768v170.666667H85.333333V768h170.666667z m85.333333-512V85.333333h341.333334v170.666667H341.333333z m597.333334 682.666667H768V768h170.666667v170.666667z';
  const icon=id=>id==='model'?'<svg class="icon modeling-icon" viewBox="-128 -128 1280 1280" aria-hidden="true"><path d="'+modelingPath+'"/></svg>':'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[id]+'"/></svg>';
  const stageName=id=>dimensions.find(item=>item[0]===id)[1];
  const projectById=id=>projects.find(project=>project.id===id);
  const currentProject=()=>projectById(state.currentProject);
  function breadcrumb(parts){$('breadcrumb').replaceChildren();parts.forEach((text,index)=>{if(index){const divider=document.createElement('span');divider.className='divider';divider.textContent='/';$('breadcrumb').append(divider)}const span=document.createElement('span');span.className='crumb';span.textContent=text;span.title=text;$('breadcrumb').append(span)})}
  function clearUtilities(){document.querySelectorAll('[data-utility]').forEach(button=>button.classList.remove('selected'))}
  function renderProjects(newId){$('project-list').replaceChildren();$('project-count').textContent=projects.length;for(const project of projects){const button=document.createElement('button');button.className='project-item'+(newId===project.id?' new-project':'');button.dataset.project=project.id;button.setAttribute('aria-label','进入赛题：'+project.name);button.innerHTML=icon('folder');const copy=document.createElement('span');copy.className='project-copy';const name=document.createElement('span');name.className='project-name';name.textContent=project.name;copy.append(name);const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');button.append(copy,arrow);button.title=project.folder;button.onclick=()=>enterProject(project.id);$('project-list').append(button)}}
  function updateSelection(){const project=currentProject();if(!project)return;clearUtilities();document.querySelectorAll('[data-dimension]').forEach(button=>{const selected=button.dataset.dimension===project.lastDimension;button.classList.toggle('active',selected&&!project.activeThread);const heading=button.closest('.dimension-heading');if(heading)heading.classList.toggle('selected',selected&&!project.activeThread);if(selected&&!project.activeThread)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});document.querySelectorAll('[data-thread]').forEach(button=>{const selected=button.dataset.thread===project.activeThread;button.classList.toggle('active',selected);if(selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});const thread=project.threads.find(item=>item.id===project.activeThread);breadcrumb([project.name,stageName(project.lastDimension),...(thread?[thread.title]:[])])}
  function selectDimension(id){const project=currentProject();if(!project)return;project.lastDimension=id;project.activeThread=null;updateSelection()}
  function selectThread(id){const project=currentProject();const thread=project.threads.find(item=>item.id===id);if(!thread)return;project.lastDimension=thread.stage;project.activeThread=id;updateSelection()}
  function toggleStage(id){const project=currentProject();project.expanded[id]=!project.expanded[id];const group=$('group-'+id);group.querySelector('.thread-list').hidden=!project.expanded[id];const disclosure=group.querySelector('.disclosure');disclosure.setAttribute('aria-expanded',String(project.expanded[id]));disclosure.setAttribute('aria-label',(project.expanded[id]?'收起':'展开')+stageName(id));group.querySelector('[data-dimension]').setAttribute('aria-expanded',String(project.expanded[id]))}
  function renderDimensions(){const project=currentProject();const nav=$('dimension-nav');const scroll=nav.scrollTop;nav.replaceChildren();for(const [key,label]of dimensions){if(!threadStages.has(key)){const button=document.createElement('button');button.className='nav-button';button.dataset.dimension=key;button.innerHTML=icon(key)+'<span>'+label+'</span>';button.onclick=()=>selectDimension(key);nav.append(button);continue}const group=document.createElement('section');group.className='dimension-group';group.id='group-'+key;const expanded=Boolean(project.expanded[key]);group.innerHTML='<div class="dimension-heading"><button class="nav-button" data-dimension="'+key+'" aria-expanded="'+expanded+'" aria-controls="threads-'+key+'">'+icon(key)+'<span>'+label+'</span></button><div class="group-actions"><button class="group-action" data-add-thread="'+key+'" aria-label="在'+label+'中添加对话" title="添加对话">'+icon('plus')+'</button><button class="group-action disclosure" aria-expanded="'+expanded+'" aria-controls="threads-'+key+'" aria-label="'+(expanded?'收起':'展开')+label+'">'+icon('chevron')+'</button></div></div><div class="thread-list" id="threads-'+key+'"'+(expanded?'':' hidden')+'></div>';
      group.querySelector('[data-dimension]').onclick=()=>{selectDimension(key);toggleStage(key)};
      group.querySelector('.disclosure').onclick=()=>toggleStage(key);
      group.querySelector('[data-add-thread]').onclick=()=>openThreadDialog(key);
      const list=group.querySelector('.thread-list');const threads=project.threads.filter(item=>item.stage===key);
      if(!threads.length){const add=document.createElement('button');add.className='empty-add';add.innerHTML=icon('plus')+'<span>添加对话</span>';add.onclick=()=>openThreadDialog(key);list.append(add)}
      for(const thread of threads){const button=document.createElement('button');button.className='thread-button';button.dataset.thread=thread.id;button.dataset.question=thread.questionId;button.innerHTML=icon('chat');const text=document.createElement('span');text.textContent=thread.title;button.append(text);const question=project.questions.find(item=>item.id===thread.questionId);button.title=question.name+' · '+thread.title;button.onclick=()=>selectThread(thread.id);list.append(button)}
      nav.append(group)
    }updateSelection();nav.scrollTop=scroll}
  function setLayer(inside){state.transition++;const token=state.transition;const outgoing=inside?$('library-layer'):$('workspace-layer');if(outgoing.contains(document.activeElement))document.activeElement.blur();outgoing.inert=true;outgoing.setAttribute('aria-hidden','true');const incoming=inside?$('workspace-layer'):$('library-layer');incoming.inert=false;incoming.removeAttribute('aria-hidden');$('sidebar').classList.toggle('in-project',inside);const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:250;setTimeout(()=>{if(token!==state.transition)return;if(inside)$('back-projects').focus({preventScroll:true});else{const previous=document.querySelector('[data-project="'+state.currentProject+'"]');(previous||$('add-project')).focus({preventScroll:true})}},duration)}
  function enterProject(id){state.currentProject=id;const project=currentProject();$('project-name').textContent=project.name;$('project-name').title=project.folder;renderDimensions();setLayer(true)}
  function backToProjects(){clearUtilities();breadcrumb(['赛题项目']);setLayer(false)}
  function openAdd(){state.pendingFolder=null;$('add-form').reset();$('folder-text').textContent='选择文件夹';$('form-error').textContent='';$('add-dialog').showModal();$('name-input').focus()}
  function setFolder(folder){state.pendingFolder=folder;$('folder-text').textContent=folder.name;$('form-error').textContent='';if(!$('name-input').value.trim())$('name-input').value=folder.name}
  function openThreadDialog(stage){state.newThreadStage=stage;const project=currentProject();$('thread-form').reset();$('thread-dialog-title').textContent=stageName(stage)+' · 新建对话';$('question-options').replaceChildren();for(const question of project.questions){const option=document.createElement('option');option.value=question.name;$('question-options').append(option)}const available=project.questions.find(question=>!project.threads.some(thread=>thread.stage===stage&&thread.questionId===question.id));const numerals=['一','二','三','四','五','六','七','八','九','十'];let index=1;let suggested;do{suggested='问题'+(numerals[index-1]||index);index++}while(project.questions.some(question=>question.name===suggested));$('question-input').value=available?available.name:suggested;$('thread-name').placeholder=$('question-input').value;$('thread-dialog').showModal();$('question-input').focus();$('question-input').select()}
  $('question-input').oninput=()=>$('thread-name').placeholder=$('question-input').value.trim();
  $('thread-form').onsubmit=event=>{event.preventDefault();const project=currentProject();const name=$('question-input').value.trim().normalize('NFKC');if(!name){$('question-input').focus();return}let question=project.questions.find(item=>item.name===name);if(!question){question={id:'question-'+(++state.questionSequence),name};project.questions.push(question)}const thread={id:'thread-'+(++state.threadSequence),projectId:project.id,questionId:question.id,stage:state.newThreadStage,title:$('thread-name').value.trim()||question.name,messages:[],draft:''};project.threads.push(thread);project.lastDimension=thread.stage;project.activeThread=thread.id;project.expanded[thread.stage]=true;$('thread-dialog').close();renderDimensions();const button=document.querySelector('[data-thread="'+thread.id+'"]');button.scrollIntoView({block:'nearest'});button.focus({preventScroll:true})};
  $('close-thread-dialog').onclick=$('cancel-thread').onclick=()=>$('thread-dialog').close();
  $('add-project').onclick=openAdd;
  $('close-dialog').onclick=$('cancel-add').onclick=()=>{if(!state.picking)$('add-dialog').close()};
  $('add-dialog').addEventListener('cancel',event=>{if(state.picking)event.preventDefault()});
  $('pick-folder').onclick=async()=>{if(!window.showDirectoryPicker){$('form-error').textContent='当前浏览器不支持选择文件夹。';return}state.picking=true;for(const id of ['pick-folder','confirm-add','cancel-add','close-dialog'])$(id).disabled=true;try{const handle=await window.showDirectoryPicker({mode:'read'});setFolder({name:handle.name,handle})}catch(error){if(error.name!=='AbortError')$('form-error').textContent='无法选择文件夹，请重试。'}finally{state.picking=false;for(const id of ['pick-folder','confirm-add','cancel-add','close-dialog'])$(id).disabled=false}};
  $('add-form').onsubmit=async event=>{event.preventDefault();const name=$('name-input').value.trim();if(!name){$('name-input').focus();return}const folder=state.pendingFolder;if(!folder){$('form-error').textContent='请选择工作区文件夹。';$('pick-folder').focus();return}$('confirm-add').disabled=true;try{for(const project of projects){if(project.handle&&await project.handle.isSameEntry(folder.handle)){$('form-error').textContent='该文件夹已添加。';return}}const id='project-'+(++state.sequence);projects.push({id,name,folder:folder.name,handle:folder.handle,lastDimension:'overview',activeThread:null,questions:[],threads:[],expanded:{}});renderProjects(id);$('add-dialog').close();document.querySelector('[data-project="'+id+'"]').focus()}catch{$('form-error').textContent='无法添加，请重新选择文件夹。'}finally{$('confirm-add').disabled=false}};
  $('back-projects').onclick=backToProjects;
  document.querySelectorAll('[data-utility]').forEach(button=>button.onclick=()=>{clearUtilities();button.classList.add('selected');document.querySelectorAll('[data-dimension],[data-thread]').forEach(item=>{item.classList.remove('active');item.removeAttribute('aria-current')});document.querySelectorAll('.dimension-heading').forEach(item=>item.classList.remove('selected'));const project=$('sidebar').classList.contains('in-project')?currentProject():null;breadcrumb(project?[project.name,button.dataset.utility]:[button.dataset.utility])});
  renderProjects();
</script>
